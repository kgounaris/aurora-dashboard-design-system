<!-- @dsCard group="Forms" height=200 subtitle="Primary · glass (secondary) · ghost · danger — sizes and states" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button — preview</title>
<style>body{margin:0;background:var(--surface-000);padding:16px;font-family:var(--font-sans)}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}</style></head>
<body>
<div class="row">
  <button class="au-btn au-btn-primary" type="button">Sign in</button>
  <button class="au-btn" type="button">Continue with SSO</button>
  <button class="au-btn au-btn-ghost" type="button">Cancel</button>
  <button class="au-btn au-btn-danger" type="button">Reboot host</button>
  <button class="au-btn au-btn-primary au-btn-icon" type="button" aria-label="Add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div class="row">
  <button class="au-btn au-btn-primary au-btn-sm" type="button">Small</button>
  <button class="au-btn au-btn-primary" type="button">Default</button>
  <button class="au-btn au-btn-primary au-btn-lg" type="button">Large</button>
  <button class="au-btn au-btn-sm" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>Refresh</button>
</div>
<div class="row">
  <button class="au-btn au-btn-primary au-loading" type="button" aria-busy="true">Signing in</button>
  <button class="au-btn au-loading" type="button" aria-busy="true">Loading</button>
  <button class="au-btn au-btn-primary" type="button" disabled>Disabled</button>
  <button class="au-btn" type="button" disabled>Disabled</button>
</div>
</body>
</html>
