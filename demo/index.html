<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Aurora — demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components/bundle.css">
<script src="../components/lib/d3.min.js"></script>
<script src="../components/bundle.js"></script>
<style>
  body { margin: 0; min-height: 100vh; padding: 32px; font-family: var(--font-sans); color: var(--ink); background: var(--surface-000);
    background-image: radial-gradient(560px 560px at 100% 40%, var(--glow-warm), transparent 65%), radial-gradient(700px 460px at 52% 100%, var(--glow-cool), transparent 65%); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; max-width: 1100px; margin: 0 auto; }
  .bar { max-width: 1100px; margin: 0 auto 20px; display: flex; justify-content: space-between; align-items: center; }
  .gauges { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); justify-items: center; gap: 8px; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
  <div class="bar">
    <h1 style="margin:0;font-size:22px">Aurora demo</h1>
    <button class="au-btn au-btn-sm" id="theme" type="button">Switch to light</button>
  </div>
  <div class="grid">
    <section class="au-card"><h2 class="au-card-title">Resource utilization</h2><div class="gauges"><div id="cpu"></div><div id="mem"></div><div id="disk"></div><div id="swap"></div></div></section>
    <section class="au-card"><h2 class="au-card-title">Service latency · p95</h2><div id="lat"></div></section>
    <section class="au-card"><h2 class="au-card-title">Egress · 7d</h2><div id="egress"></div></section>
    <section class="au-card"><h2 class="au-card-title">Storage</h2><div class="stack"><div id="m1"></div><div id="m2"></div><div id="m3"></div></div></section>
    <section class="au-card"><h2 class="au-card-title">Sign in</h2>
      <form class="au-form" onsubmit="return false">
        <div class="au-field"><label class="au-label" for="email">Email</label><div class="au-control"><input class="au-input" id="email" type="email" placeholder="you@company.com"></div></div>
        <div class="au-field"><label class="au-label" for="pw">Password</label><div class="au-control"><input class="au-input" id="pw" type="password" placeholder="Enter your password"></div></div>
        <label class="au-choice"><input type="checkbox" checked> Remember this device</label>
        <button class="au-btn au-btn-primary au-btn-block" type="submit">Sign in</button>
      </form>
    </section>
    <section class="au-card" style="grid-column: 1 / -1"><h2 class="au-card-title">Logs</h2><div id="logs"></div></section>
  </div>
<script>
  const A = window.Aurora;
  const charts = [];
  function mount() {
    charts.forEach(c => c.destroy()); charts.length = 0;
    charts.push(
      A.RadialProgress('#cpu',  { value: 0.38, size: 72, thickness: 8, status: 'auto', label: '38%', sublabel: 'CPU' }),
      A.RadialProgress('#mem',  { value: 0.72, size: 72, thickness: 8, status: 'auto', label: '72%', sublabel: 'Memory' }),
      A.RadialProgress('#disk', { value: 0.94, size: 72, thickness: 8, status: 'auto', label: '94%', sublabel: 'Disk' }),
      A.RadialProgress('#swap', { value: 0.12, size: 72, thickness: 8, status: 'auto', label: '12%', sublabel: 'Swap' }),
      A.WaveLine('#lat', { height: 80, series: [
        { name: 'api-gateway', status: 'base',    data: [120,118,125,140,132,128,150,162,148,135,130,126,124] },
        { name: 'auth',        status: 'healthy', data: [60,62,58,61,64,60,63,66,62,59,61,60,58] },
        { name: 'billing',     status: 'warning', data: [180,190,210,240,235,260,290,310,300,280,265,250,245] },
        { name: 'search',      status: 'danger',  data: [200,230,260,310,380,420,470,520,560,540,510,500,495] } ] }),
      A.ColumnChart('#egress', { height: 150, format: v => v.toFixed(1) + ' GB', data: [
        { label: 'Tue', value: 18.4 }, { label: 'Wed', value: 22.1 }, { label: 'Thu', value: 19.7 }, { label: 'Fri', value: 31.2 }, { label: 'Sat', value: 12.8 }, { label: 'Sun', value: 9.6 }, { label: 'Mon', value: 24.3 } ] }),
      A.ProgressBar('#m1', { label: '/ root', value: 0.94, status: 'auto', labelWidth: 72 }),
      A.ProgressBar('#m2', { label: '/var',   value: 0.61, status: 'auto', labelWidth: 72 }),
      A.ProgressBar('#m3', { label: 'inodes', value: 0.23, status: 'auto', labelWidth: 72 }),
      A.DataTable('#logs', { maxHeight: 220, rowKey: 'id', sortBy: { key: 'time', dir: 'desc' },
        columns: [
          { key: 'time', label: 'Time', type: 'time', width: 112 }, { key: 'level', label: 'Level', type: 'level', width: 92 },
          { key: 'service', label: 'Service', width: 130 }, { key: 'message', label: 'Message', type: 'mono' },
          { key: 'ms', label: 'Latency', type: 'number', width: 90, format: v => v == null ? '—' : v + ' ms' } ],
        rows: [
          { id: 1, time: '11:42:07.318', level: 'error', service: 'queue-worker', message: 'OOMKilled: container exceeded memory limit (512Mi); restarting (5/5)', ms: null },
          { id: 2, time: '11:41:58.004', level: 'warn',  service: 'redis', message: 'maxmemory 92% reached; evicting keys with allkeys-lru', ms: null },
          { id: 3, time: '11:41:52.771', level: 'info',  service: 'api-gateway', message: 'GET /api/v1/orders?page=3 200', ms: 142 },
          { id: 4, time: '11:41:33.611', level: 'ok',    service: 'backup', message: 'snapshot verified (41.2 GB)', ms: null } ] })
    );
  }
  mount();
  document.getElementById('theme').addEventListener('click', e => {
    const html = document.documentElement, light = html.dataset.theme === 'light';
    html.dataset.theme = light ? 'dark' : 'light';
    e.target.textContent = light ? 'Switch to light' : 'Switch to dark';
    mount(); // charts read tokens at render time
  });
</script>
</body>
</html>
